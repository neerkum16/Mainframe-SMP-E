# shop.conf - single source of site-specific values.
# Format: KEY=VALUE. No quotes. No trailing spaces. Lines starting with # ignored.
# Values may reference other tokens as @@KEY@@ (resolved up to 5 passes).
# Edit this file only. Never edit build/ output.

# --- Environment ---
LABHLQ=SMPLAB
USERID=MYUSER
JOBPFX=SMPL
JOBPARMS=(ACCT),'SMPE LAB',CLASS=A,MSGCLASS=X,NOTIFY=&SYSUID,REGION=0M
PGMRNAME=SMPE LAB
ALLOCATTR=STORCLAS=SMSSTD
CSIPLACE=STORAGECLASS(SMSSTD)
ZFSROOT=/u/myuser/smplab
ZFSDSN=@@LABHLQ@@.ZFS

# --- Zones ---
GZONE=GLOBAL
TZ1=TGT1
DZ1=DLB1
TZ2=TGT2
DZ2=DLB2
ZSET1=ZSET1

# --- CSI datasets ---
GCSI=@@LABHLQ@@.GLOBAL.CSI
TCSI1=@@LABHLQ@@.TGT1.CSI
DCSI1=@@LABHLQ@@.DLB1.CSI
TCSI2=@@LABHLQ@@.TGT2.CSI
DCSI2=@@LABHLQ@@.DLB2.CSI

