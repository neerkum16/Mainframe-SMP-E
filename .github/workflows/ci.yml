name: ci

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: pip install pyyaml
      - run: npm install -g @mermaid-js/mermaid-cli markdownlint-cli2
      - run: python tools/check_code.py
      - run: python tools/check_coverage.py --write
      - name: Coverage matrix is up to date
        run: git diff --exit-code coverage-matrix.md
      - run: python tools/check_mermaid.py
      - run: python tools/build.py
      - run: markdownlint-cli2 "articles/*.md" "*.md" "labs/env/*.md"
      - uses: actions/upload-artifact@v4
        with:
          name: course-articles
          path: dist/
